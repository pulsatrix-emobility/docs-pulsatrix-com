version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(DEV-1195):"
    groups:
      docusaurus:
        patterns:
        - "@docusaurus*"
      react:
        patterns:
        - "@mdx-js/react"
        - "react*"
        - "prism-react-renderer"
    ignore:
      # Transitive Docusaurus/redocusaurus-Deps, die Security-Fixes blockieren,
      # solange @docusaurus/core an der alten Version haengt. Siehe CLAUDE.md.
      - dependency-name: "serialize-javascript"
      - dependency-name: "@babel/core"
      - dependency-name: "http-proxy-middleware"
      - dependency-name: "joi"
      - dependency-name: "uuid"
